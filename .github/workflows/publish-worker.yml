name: Publish ImageForge worker

on:
  workflow_dispatch:
  push:
    paths:
      - "worker/**"
      - ".github/workflows/publish-worker.yml"

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish immutable amd64 worker
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build worker image (publish from imageforge-worker repository)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./worker
          file: ./worker/Dockerfile
          platforms: linux/amd64
          push: false
          tags: |
            imageforge-worker:ci-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=imageforge-worker
          cache-to: type=gha,mode=max,scope=imageforge-worker

      - name: Report publish ownership
        run: |
          echo "Worker source validation passed. The public immutable runtime image is published from Pala-LakshmanSai/imageforge-worker."
