[package]
name = "imageforge-desktop-core"
version = "0.2.1"
description = "Narrow native host for the ImageForge desktop production console"
authors = ["ImageForge"]
edition = "2021"

[lib]
name = "imageforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "imageforge-desktop-core"
path = "src/main.rs"
test = false
bench = false

[build-dependencies]
cc = "=1.4.0"
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
futures-util = "=0.3.33"
hex = "=0.4.3"
image = { version = "=0.25.9", default-features = false, features = ["jpeg", "png", "webp"] }
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.149", features = ["raw_value"] }
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-notification = "=2.3.3"
tokio = { version = "=1.53.1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync"] }
url = "=2.5.8"
uuid = { version = "=1.24.0", features = ["serde", "v4"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
rfd = "=0.17.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
objc2 = { version = "=0.6.4", features = ["std"] }
objc2-app-kit = { version = "=0.3.2", features = ["block2"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
windows-core = "=0.61.2"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[dev-dependencies]
tempfile = "=3.27.0"
