[package]
name = "imageforge-desktop-core"
version = "0.1.0"
description = "Narrow native host for the ImageForge desktop production console"
authors = ["ImageForge"]
edition = "2021"

[lib]
name = "imageforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "imageforge-desktop-core"
path = "src/main.rs"
test = false
bench = false

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
futures-util = "=0.3.33"
hex = "=0.4.3"
image = { version = "=0.25.9", default-features = false, features = ["jpeg", "png", "webp"] }
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = [] }
tokio = { version = "=1.53.1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync"] }
url = "=2.5.8"
uuid = { version = "=1.24.0", features = ["serde", "v4"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
rfd = "=0.17.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[dev-dependencies]
tempfile = "=3.27.0"
