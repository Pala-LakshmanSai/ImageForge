<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">ImageForge mark</title>
  <desc id="desc">A luminous aperture forged from coral, violet, blue, and cyan light.</desc>
  <defs>
    <linearGradient id="bg" x1="90" y1="48" x2="930" y2="980" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1a102a"/>
      <stop offset=".48" stop-color="#0c122b"/>
      <stop offset="1" stop-color="#071b34"/>
    </linearGradient>
    <linearGradient id="forge" x1="210" y1="188" x2="830" y2="846" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff5969"/>
      <stop offset=".34" stop-color="#ff3f72"/>
      <stop offset=".68" stop-color="#9a55ff"/>
      <stop offset="1" stop-color="#2f83ff"/>
    </linearGradient>
    <linearGradient id="blade" x1="350" y1="286" x2="690" y2="740" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff8f2"/>
      <stop offset=".44" stop-color="#d8d9ff"/>
      <stop offset="1" stop-color="#8da8ff"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(332 286) rotate(48) scale(640)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff496b" stop-opacity=".34"/>
      <stop offset=".48" stop-color="#8a55ff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#2f83ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0" cy="0" r="1" gradientTransform="translate(464 444) rotate(42) scale(218)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8deaff" stop-opacity=".92"/>
      <stop offset=".55" stop-color="#4e85ff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#2f6fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="smallGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="250" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="250" fill="url(#halo)"/>
  <rect x="48" y="48" width="928" height="928" rx="236" fill="none" stroke="#d8e4ff" stroke-opacity=".16" stroke-width="8"/>

  <circle cx="512" cy="512" r="322" fill="none" stroke="#5b68be" stroke-opacity=".22" stroke-width="20"/>
  <circle cx="512" cy="512" r="286" fill="none" stroke="url(#forge)" stroke-width="74"/>
  <circle cx="512" cy="512" r="246" fill="#0a1029" stroke="#f7f4ef" stroke-opacity=".12" stroke-width="6"/>
  <circle cx="512" cy="512" r="216" fill="url(#core)" opacity=".75" filter="url(#softGlow)"/>

  <!-- Six bright aperture blades: an image lens with a forged, editorial edge. -->
  <g fill="url(#blade)" opacity=".96">
    <path d="M512 278c-72 0-130 58-130 130 0 43 21 81 53 104l77-134 77 134c32-23 53-61 53-104 0-72-58-130-130-130Z"/>
    <path d="M512 278c-72 0-130 58-130 130 0 43 21 81 53 104l77-134 77 134c32-23 53-61 53-104 0-72-58-130-130-130Z" transform="rotate(60 512 512)"/>
    <path d="M512 278c-72 0-130 58-130 130 0 43 21 81 53 104l77-134 77 134c32-23 53-61 53-104 0-72-58-130-130-130Z" transform="rotate(120 512 512)"/>
    <path d="M512 278c-72 0-130 58-130 130 0 43 21 81 53 104l77-134 77 134c32-23 53-61 53-104 0-72-58-130-130-130Z" transform="rotate(180 512 512)"/>
    <path d="M512 278c-72 0-130 58-130 130 0 43 21 81 53 104l77-134 77 134c32-23 53-61 53-104 0-72-58-130-130-130Z" transform="rotate(240 512 512)"/>
    <path d="M512 278c-72 0-130 58-130 130 0 43 21 81 53 104l77-134 77 134c32-23 53-61 53-104 0-72-58-130-130-130Z" transform="rotate(300 512 512)"/>
  </g>
  <circle cx="512" cy="512" r="89" fill="#080d22" stroke="#f7f4ef" stroke-opacity=".78" stroke-width="13"/>
  <circle cx="512" cy="512" r="54" fill="url(#core)"/>
  <circle cx="496" cy="496" r="15" fill="#f7f4ef" opacity=".9"/>

  <!-- The spark is the generated frame leaving the lens. -->
  <g fill="#77e9ff" filter="url(#smallGlow)" opacity=".9">
    <path d="m784 228 25 62 62 25-62 25-25 62-25-62-62-25 62-25 25-62Z"/>
  </g>
  <path d="m784 228 18 45 45 18-45 18-18 45-18-45-45-18 45-18 18-45Z" fill="#77e9ff"/>
  <circle cx="244" cy="788" r="12" fill="#ff5969"/>
  <circle cx="244" cy="788" r="28" fill="none" stroke="#ff5969" stroke-opacity=".32" stroke-width="8"/>
</svg>
